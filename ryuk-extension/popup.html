<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryuk Bookmark Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --card-bg: #121215;
      --input-bg: #18181d;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.22);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent: #6366f1;
      --emerald: #10b981;
      --rose: #f43f5e;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 360px;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      min-height: 400px;
      background: radial-gradient(circle at 100% 0%, rgba(99, 102, 241, 0.08), transparent 60%), var(--bg);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 18, 21, 0.85);
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1f1f26 0%, #121216 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .brand-info h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand-info span {
      font-size: 11px;
      color: var(--text-dim);
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--text);
      border-color: var(--border-focus);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Main Container */
    .content {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .view {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .view.active {
      display: flex;
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Setup Needed Card */
    .setup-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .lock-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .setup-card h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .setup-card p {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Site Meta Preview Strip */
    .meta-preview {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .favicon-box {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .favicon-box img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .url-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 270px;
    }

    /* Form Fields */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    input, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 9px 12px;
      font-family: var(--font-body);
      font-size: 12.5px;
      transition: all 0.15s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
      background: #1c1c22;
    }

    textarea {
      resize: vertical;
      min-height: 52px;
    }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 38px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .btn-primary:hover {
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.12);
    }

    .btn-accent {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-accent:hover {
      background: #4f46e5;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Status Banner */
    .status-banner {
      font-size: 12px;
      line-height: 1.4;
      padding: 9px 12px;
      border-radius: 8px;
      display: none;
    }

    .status-banner.show {
      display: block;
      animation: fadeIn 0.15s ease;
    }

    .status-banner.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--emerald);
    }

    .status-banner.error {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.25);
      color: var(--rose);
    }

    .status-banner.info {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
    }

    /* Footer */
    .footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      background: rgba(18, 18, 21, 0.4);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div class="brand-info">
          <h1>Ryuk</h1>
          <span>Bookmark Manager</span>
        </div>
      </div>
      <button type="button" id="openSettingsBtn" class="icon-btn" title="Open Extension Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <!-- Main Content -->
    <div class="content">
      <!-- Missing API Key View -->
      <div id="noKeyView" class="view">
        <div class="setup-card">
          <div class="lock-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h2>API Key Required</h2>
          <p>Please enter your API key and server URL in extension settings to enable 1-click bookmarking.</p>
          <button type="button" id="goToSettingsBtn" class="btn btn-accent" style="margin-top: 6px;">
            Configure Settings
          </button>
        </div>
      </div>

      <!-- Main Bookmark Saver View -->
      <div id="mainView" class="view">
        <div class="meta-preview">
          <div class="favicon-box">
            <img id="faviconImg" src="" alt="favicon" />
          </div>
          <div id="urlDisplay" class="url-badge">Loading tab URL...</div>
        </div>

        <div class="field">
          <label for="titleInput" class="label">Title</label>
          <input type="text" id="titleInput" placeholder="Fetching title..." spellcheck="false">
        </div>

        <div class="field">
          <label for="descriptionInput" class="label">Description</label>
          <textarea id="descriptionInput" rows="2" placeholder="Fetching site description..."></textarea>
        </div>

        <input type="hidden" id="iconInput" value="">

        <button type="button" id="saveBtn" class="btn btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Save Bookmark</span>
        </button>

        <div id="statusMsg" class="status-banner"></div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>INSTANT CAPTURE</span>
      <span>RYUK SAAS</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
